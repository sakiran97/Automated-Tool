services:
  - type: web
    name: bugbounty-tracker
    env: docker
    plan: free
    dockerfilePath: Dockerfile
    healthCheckPath: /api/health
    envVars:
      - key: APP_NAME
        value: Bug Bounty Tracker
      - key: JWT_SECRET
        generateValue: true
      - key: CORS_ORIGINS
        value: '["*"]'
